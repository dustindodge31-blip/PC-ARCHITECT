<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PC Architect — Case Viewer</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0E0E12; overflow: hidden; }
  #viewer { width: 100%; height: 100%; }
  #credit {
    position: fixed; bottom: 6px; left: 0; right: 0; text-align: center;
    font-family: sans-serif; font-size: 10px; color: #9A9AA6; pointer-events: none;
  }
</style>
<script src="vendor/three/three.min.js"></script>
<script src="vendor/three/addons/loaders/GLTFLoader.js"></script>
<script src="vendor/three/addons/controls/OrbitControls.js"></script>
</head>
<body>
<div id="viewer"></div>
<div id="credit">Model by Meilov (Sketchfab)</div>

<script>
const container = document.getElementById('viewer');

const scene = new THREE.Scene();
scene.background = null; // transparent, shows through to the app's dark bg

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(3, 2, 4);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;
container.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xffffff, 0x222222, 1.2);
scene.add(hemi);

const ambient = new THREE.AmbientLight(0xffffff, 1.0);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
keyLight.position.set(5, 8, 5);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xd10007, 1.2);
fillLight.position.set(-5, 2, -5);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffffff, 1.0);
rimLight.position.set(0, 5, -8);
scene.add(rimLight);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1;
controls.maxDistance = 20;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;

const loader = new THREE.GLTFLoader();
loader.load(
  'models/pc_case/scene.gltf',
  (gltf) => {
    const model = gltf.scene;

    // Center and scale the model to fit a consistent view regardless of its native size.
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    const scale = 2.5 / maxDim;
    model.scale.setScalar(scale);
    model.position.sub(center.multiplyScalar(scale));

    // No environment map for reflections, so PBR-metal materials would otherwise
    // render near-black (metals have ~0 diffuse response) -- cap metalness and
    // add a touch of ambient response so the model reads clearly under our
    // simple directional-light rig.
    model.traverse((child) => {
      if (child.isMesh && child.material) {
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        for (const mat of mats) {
          if (mat.metalness !== undefined) mat.metalness = Math.min(mat.metalness, 0.35);
          if (mat.roughness !== undefined) mat.roughness = Math.max(mat.roughness, 0.4);
        }
      }
    });

    scene.add(model);
  },
  undefined,
  (error) => {
    console.error('Failed to load model:', error);
  }
);

function onResize() {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
}
window.addEventListener('resize', onResize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
